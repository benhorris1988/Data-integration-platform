[project]
name = "lakebridge-orchestrator"
version = "0.1.0"
description = "Lakebridge orchestrator — IFS → SQL Server staging engine and operator API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "oracledb>=2.4",
    "pyodbc>=5.1",
    "apscheduler>=3.10,<4",
    "croniter>=3.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "click>=8.1",
    "sse-starlette>=2.1",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
lakebridge-migrate = "lakebridge.migrate:cli"
lakebridge-serve = "lakebridge.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakebridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PT"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses call-in-default — these are not bugs.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
