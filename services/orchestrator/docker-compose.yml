# Local development stack. Brings up SQL Server 2022 + the orchestrator.
# An Oracle stand-in is intentionally NOT here — `test-connection` and run
# dispatch require real IFS network reachability, which is not something
# we can fake usefully. Mock the source in unit tests instead.

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Lakebridge!Dev2026"  # dev only; rotate in real envs
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
      start_period: 30s

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      LAKEBRIDGE_ENV: "dev"
      LAKEBRIDGE_REGION: "local"
      LAKEBRIDGE_MSSQL_HOST: "mssql"
      LAKEBRIDGE_MSSQL_PORT: "1433"
      LAKEBRIDGE_MSSQL_USER: "sa"
      LAKEBRIDGE_MSSQL_PASSWORD: "Lakebridge!Dev2026"
      LAKEBRIDGE_MSSQL_DATABASE: "lakebridge"
      LAKEBRIDGE_MSSQL_ENCRYPT: "yes"
      LAKEBRIDGE_MSSQL_TRUST_SERVER_CERTIFICATE: "yes"
      LAKEBRIDGE_API_HOST: "0.0.0.0"
      LAKEBRIDGE_API_PORT: "8080"
      LAKEBRIDGE_CORS_ALLOW_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8080:8080"

volumes:
  mssql-data:
