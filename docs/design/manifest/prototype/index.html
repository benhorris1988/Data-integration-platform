<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lakebridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
        },
        fontSize: {
          'xs':   ['11px', { lineHeight: '16px' }],
          'sm':   ['13px', { lineHeight: '20px' }],
          'base': ['14px', { lineHeight: '22px' }],
          'lg':   ['16px', { lineHeight: '24px' }],
          'xl':   ['20px', { lineHeight: '28px' }],
          '2xl':  ['28px', { lineHeight: '36px' }],
        },
        borderRadius: {
          'sm': '2px',
          DEFAULT: '2px',
          'md': '6px',
          'lg': '6px',
        },
        colors: {
          // Light tokens (default)
          bg:            '#FAFAFA',
          surface:       '#FFFFFF',
          'surface-2':   '#F4F4F5',
          border:        '#E4E4E7',
          'border-strong': '#D4D4D8',
          text:          '#18181B',
          'text-muted':  '#71717A',
          'text-subtle': '#A1A1AA',
          // Dark tokens (use with dark: prefix)
          'd-bg':            '#0A0A0B',
          'd-surface':       '#111113',
          'd-surface-2':     '#18181B',
          'd-border':        '#27272A',
          'd-border-strong': '#3F3F46',
          'd-text':          '#FAFAFA',
          'd-text-muted':    '#A1A1AA',
          'd-text-subtle':   '#71717A',
          // Brand + semantic
          brand:        '#2563EB',
          'brand-hover':'#1D4ED8',
          success:      '#16A34A',
          warning:      '#D97706',
          danger:       '#DC2626',
          info:         '#0891B2',
          queued:       '#71717A',
        },
        boxShadow: {
          'overlay': '0 4px 16px -2px rgba(0,0,0,0.08), 0 2px 6px -1px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04)',
          'overlay-dark': '0 4px 16px -2px rgba(0,0,0,0.5), 0 2px 6px -1px rgba(0,0,0,0.4)',
        },
      },
    },
  };
</script>
<style>
  html, body, #root { height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #FAFAFA; color: #18181B; -webkit-font-smoothing: antialiased; }
  html.dark body { background: #0A0A0B; color: #FAFAFA; }
  /* thin scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  html.dark ::-webkit-scrollbar-thumb { background: #3F3F46; background-clip: content-box; border: 2px solid transparent; }
  /* focus ring uniformity */
  :focus-visible { outline: 2px solid #2563EB; outline-offset: 1px; }
  /* in-flight pulse for status nodes */
  @keyframes lb-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(37,99,235,0.5);} 50% { box-shadow: 0 0 0 6px rgba(37,99,235,0);} }
  .lb-pulse { animation: lb-pulse 1.6s ease-out infinite; }
  /* spinning dots for buttons */
  @keyframes lb-spin { to { transform: rotate(360deg); } }
  .lb-spin { animation: lb-spin 0.7s linear infinite; }
  /* skeleton shimmer (subtle) */
  @keyframes lb-shimmer { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }
  .lb-skeleton {
    background: linear-gradient(90deg, #F4F4F5 0px, #E4E4E7 80px, #F4F4F5 160px);
    background-size: 200px 100%;
    animation: lb-shimmer 1.2s ease-in-out infinite;
  }
  html.dark .lb-skeleton {
    background: linear-gradient(90deg, #18181B 0px, #27272A 80px, #18181B 160px);
    background-size: 200px 100%;
  }
  /* prevent layout shift from font loading */
  .tabular { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

<script src="data.js"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screen-jobs.jsx"></script>
<script type="text/babel" src="screen-run.jsx"></script>
<script type="text/babel" src="screen-dashboard.jsx"></script>
<script type="text/babel" src="screen-misc.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
